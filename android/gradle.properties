# 🚀 Gradle Performance (Optimized)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx2G

# ⚡ Speed optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# 📱 AndroidX
android.useAndroidX=true
android.enableJetifier=true

# ☕ Java path (optional)
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# 📦 APK alignment
android.injected.apk.alignPageSize=16384